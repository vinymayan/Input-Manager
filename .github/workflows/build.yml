name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap vcpkg
        shell: cmd
        run: ./extern/vcpkg/bootstrap-vcpkg.bat

      - name: Install dependencies
        run: ./extern/vcpkg/vcpkg install --triplet x64-windows

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/extern/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build
        run: >
          cmake
          --build build
          --config Release
          --parallel
          --verbose
          
      - name: Assemble install directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dlls = @(
            Get-ChildItem `
              -Path build `
              -Recurse `
              -File `
              -Filter InputManager.dll
          )

          if ($dlls.Count -ne 1) {
            $dlls | ForEach-Object { Write-Host $_.FullName }
            throw "Expected exactly one InputManager.dll"
          }

          New-Item -ItemType Directory -Force -Path package | Out-Null
          
          Copy-Item `
            -LiteralPath Data `
            -Destination package `
            -Recurse `
            -Force

      - name: Upload InputManager install
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: InputManager-install
          path: package/
          if-no-files-found: error
